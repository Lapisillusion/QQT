<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QQT · M0 模拟验证</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <header>
      <div><p class="eyebrow">QQT / SIMULATION LAB</p><h1 id="scenario-title">M0 脚本验证</h1><p class="subtitle">执行预设动作，核对移动、泡泡与死亡处理。</p></div>
      <div class="actions"><div id="battle-controls" hidden><label>人数 <select id="player-count"><option>2</option><option>3</option><option selected>4</option></select></label> <label><input id="manual-tick" type="checkbox">逐帧推进</label> <label>种子 <input id="spawn-seed" type="number" placeholder="随机" style="width:6em"></label> <button id="create-match">创建对局</button> <span id="seats"></span></div><button id="demonstrate" hidden disabled>tick演示</button><span id="connection" class="connection">正在连接</span><button id="start" disabled>开始验证 <span>↗</span></button></div>
    </header>
    <section class="workspace">
      <div class="board-panel">
        <div class="panel-heading"><span><i class="live-dot"></i> 全局场景</span><span>21 × 21 · 场景地图</span></div>
        <div class="canvas-wrap"><canvas id="map" aria-label="泡泡对战场景地图"></canvas></div>
        <div class="legend"><span><img src="/icons/item-speed.svg" alt="">移速 +1</span><span><img src="/icons/item-range.svg" alt="">火力 +1</span><span><img src="/icons/item-capacity.svg" alt="">泡泡容量 +1</span><span><img src="/icons/item-vision.svg" alt="">视野半径 +1</span><span><i class="wall"></i>硬墙</span><span><i class="crate"></i>箱子</span><span><i class="bubble"></i>泡泡</span><span>角色上的数字为玩家编号</span></div>
      </div>
      <aside>
        <section class="status-panel">
          <div class="panel-heading"><span>验证进度</span><span id="status" class="badge">准备就绪</span></div>
          <div class="tick-line"><strong id="tick">0</strong><span>/ <span id="total-ticks">—</span> tick</span></div>
          <div class="progress"><div id="progress"></div></div>
          <div class="metrics"><div><strong id="bubbles">0</strong><span>在场泡泡</span></div><div><strong id="crates">329</strong><span>剩余箱子</span></div><div><strong id="safe">4</strong><span>存活玩家</span></div></div>
          <p id="result" class="result">运行后按脚本预期核对位置、死亡时刻和泡泡处理。</p>
        </section>
        <section class="status-panel player-panel" aria-labelledby="player-panel-title">
          <div class="panel-heading"><span id="player-panel-title">玩家实时属性</span><span>增益下一轮生效</span></div>
          <div id="players" class="players"></div>
        </section>
        <section class="log-panel">
          <div class="panel-heading"><span>事件日志</span><span id="event-count">0 条</span></div>
          <div id="log" class="log" role="log"><p class="empty-log">开始验证后显示模拟事件。</p></div>
        </section>
      </aside>
    </section>
    <footer><span id="scenario-footer">M0 · 预设脚本</span><span>精确时刻 · 参数见玩家状态</span></footer>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
